<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your HealthFlow password</title>
  </head>
  <body style="margin:0;background:#f4f7f6;font-family:Arial,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #dbe5e1;border-radius:8px;">
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 16px;font-size:22px;color:#0f766e;">Reset your HealthFlow password</h1>
                <p style="margin:0 0 24px;line-height:1.6;">Use the button below to create a new password. You may open this link on your phone or another trusted device.</p>
                <p style="margin:0 0 24px;">
                  <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;padding:12px 18px;background:#0f766e;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:700;">Create new password</a>
                </p>
                <p style="margin:0;font-size:13px;line-height:1.5;color:#64748b;">If you did not request this reset, ignore this email. This link is single-use and expires automatically.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
