name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            local-branch-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The branch server has its own package.json; its tests import its packages (dotenv, better-sqlite3, ...).
      - name: Install branch server dependencies
        run: npm ci --prefix local-branch-server

      - name: Check production dependency vulnerabilities
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix local-branch-server --omit=dev --audit-level=high

      - name: Verify protected production baseline
        run: npm run protect:baseline

      - name: Validate migrations
        run: npm run protect:migrations

      - name: Run production contract tests
        run: npm run test:contracts

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build app
        run: npm run build

  # Opens the built app in a real browser at phone, tablet and computer sizes
  # (against a fake backend, never production) and fails when a key screen runs
  # off the screen, loses its menu, or crashes.
  browser-layout-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Run browser layout guard
        run: npm run test:e2e

      - name: Keep the failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-layout-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
