name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            local-branch-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The branch server has its own package.json; its tests import its packages (dotenv, better-sqlite3, ...).
      - name: Install branch server dependencies
        run: npm ci --prefix local-branch-server

      - name: Check production dependency vulnerabilities
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix local-branch-server --omit=dev --audit-level=high

      - name: Verify protected production baseline
        run: npm run protect:baseline

      - name: Validate migrations
        run: npm run protect:migrations

      - name: Run production contract tests
        run: npm run test:contracts

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build app
        run: npm run build
